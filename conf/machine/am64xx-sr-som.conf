#@TYPE: Machine
#@NAME: SolidRun AM64 SoM
#@SOC: AM64
#@DESCRIPTION: Machine configuration for SolidRun AM64 SoM
#@MAINTAINER: Josua Mayer <josua@solid-run.com>

DEFAULTTUNE ?= "cortexa53-crypto"
require conf/machine/include/arm/armv8a/tune-cortexa53.inc

##### copy k3.inc with modifications #####
# fixme: require conf/machine/include/k3.inc
# changes: do not include arch-arm64.inc, it is already pulled in above from tune-cortexa53.inc
# TI K3 Aarch64 profile for Cortex-A53 cores

require conf/machine/include/ti-soc.inc
SOC_FAMILY:append = ":k3"

# avoid double inclusion of arch-arm64.inc, pulled from tune-cortexa53.inc via arch-armv8a.inc
#require conf/machine/include/arm/arch-arm64.inc

require conf/machine/include/ti-bsp.inc

KERNEL_IMAGETYPE = "Image"
KERNEL_IMAGETYPES = "Image fitImage"
KERNEL_CLASSES += "kernel-fitimage"

UBOOT_ARCH = "arm"
UBOOT_ENTRYPOINT = "0x81000000"
UBOOT_LOADADDRESS = "0x81000000"
UBOOT_RD_LOADADDRESS = "0x84000000"
UBOOT_RD_ENTRYPOINT = "0x84000000"
UBOOT_DTB_LOADADDRESS = "0x83000000"
UBOOT_DTBO_LOADADDRESS = "0x83080000"
UBOOT_DTBO_OFFSET = "0x00010000"

SPL_BINARY = "tispl.bin"
SPL_BINARYNAME = "tispl.bin"
UBOOT_SUFFIX = "img"

UBOOT_SIGN_ENABLE = "1"
UBOOT_MKIMAGE_DTCOPTS = "-I dts -O dtb"
UBOOT_SIGN_KEYNAME ?= "custMpk"
UBOOT_SIGN_KEYDIR ?= "${TI_SECURE_DEV_PKG}/keys"
FIT_HASH_ALG ?= "sha512"
FIT_SIGN_ALG ?= "rsa4096"

EXTRA_IMAGEDEPENDS += "virtual/bootloader"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-image-image"

TFA_PLATFORM = "k3"

# Use the expected value of the ubifs filesystem's volume name in the kernel
# and u-boot.
UBI_VOLNAME = "rootfs"

# List common SoC features, may need to add touchscreen for specific machines
MACHINE_FEATURES = "apm usbgadget usbhost vfat ext2 alsa pci"

IMAGE_FSTYPES += "tar.xz wic.xz wic.bmap"

IMAGE_BOOT_FILES ?= "${SPL_BINARYNAME} u-boot.${UBOOT_SUFFIX} tiboot3.bin"
IMAGE_EFI_BOOT_FILES ?= "${IMAGE_BOOT_FILES}"

EFI_PROVIDER ?= "grub-efi"
MACHINE_FEATURES += "efi"

WKS_FILE ?= "${@bb.utils.contains("MACHINE_FEATURES", "efi", "sdimage-2part-efi.wks.in", "sdimage-2part.wks", d)}"

do_image_wic[depends] += "virtual/bootloader:do_deploy"

SERIAL_CONSOLES = "115200;ttyS0 115200;ttyS2"

##### end k3.inc with modifications #####

require conf/machine/include/mc_k3r5.inc

SOC_FAMILY:append = ":am64xx"

KERNEL_DEVICETREE_PREFIX = "ti/k3-am642"

KERNEL_DEVICETREE = " \
    ti/k3-am642-hummingboard-t.dtb \
    ti/k3-am642-hummingboard-t-pcie.dtb \
    ti/k3-am642-hummingboard-t-usb3.dtb \
    ti/k3-am642-sr-som.dtb \
"

# Default tiboot3.bin on AM64x is for SR2.0 HS-FS
IMAGE_BOOT_FILES += "tiboot3-am64x_sr2-hs-fs-sr-som.bin"

# Since default tiboot3.bin on AM64x is for SR2.0 HS-FS, add a version for GP
IMAGE_BOOT_FILES += "tiboot3-am64x-gp-sr-som.bin"

# Since default tiboot3.bin on AM64x is for SR2.0 HS-FS, add a version for SR2.0 HS-SE
IMAGE_BOOT_FILES += "tiboot3-am64x_sr2-hs-sr-som.bin"

TFA_BOARD = "lite"

OPTEEMACHINE = "k3-am64x"

UBOOT_MACHINE = "am64som_a53_defconfig"

# on top of k3 defaults add extra features
MACHINE_FEATURES:append = "rtc serial"
# am64 has no integrated audio support
MACHINE_FEATURES:remove = "alsa"

# include drivers & firmware
# find arago-tmp-default-glibc/work/am64xx_evm-oe-linux/linux-ti-staging/6.1.46+gitAUTOINC+247b2535b2-r0b.arago5_tisdk_2_edgeai_0_edgeai_7/packages-split -type f -name cdns*usb*common.ko
#MACHINE_EXTRA_RDEPENDS:append:am64xx-sr-som = "
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    kernel-module-at24 \
    kernel-module-can-dev \
    kernel-module-cdns3 \
    kernel-module-cdns3-ti \
    kernel-module-cdns-usb-common \
    kernel-module-crct10dif-ce \
    kernel-module-dm-mod \
    kernel-module-fuse \
    kernel-module-hdc2010 \
    kernel-module-hsr \
    kernel-module-icssg-prueth \
    kernel-module-icss-iep \
    kernel-module-ip-tables \
    kernel-module-ipv6 \
    kernel-module-irq-pruss-intc \
    kernel-module-k3-j72xx-bandgap \
    kernel-module-m-can \
    kernel-module-m-can-platform \
    kernel-module-opt3001 \
    kernel-module-optee-rng \
    kernel-module-pcie-cadence \
    kernel-module-pcie-cadence-host \
    kernel-module-pci-endpoint-test \
    kernel-module-pci-j721e \
    kernel-module-pci-j721e-host \
    kernel-module-pru-rproc \
    kernel-module-pruss \
    kernel-module-rng-core \
    kernel-module-rtc-abx80x \
    kernel-module-rti-wdt \
    kernel-module-sa2ul \
    kernel-module-ti-k3-common \
    kernel-module-ti-k3-m4-remoteproc \
    kernel-module-ti-k3-r5-remoteproc \
    kernel-module-xhci-plat-hcd \
    kernel-module-x-tables \
